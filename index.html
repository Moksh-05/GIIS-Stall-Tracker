<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Tracker — Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f3;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border:1px solid #e5e5e2;border-radius:16px;padding:40px;max-width:400px;width:100%}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
.sub{font-size:13px;color:#888;margin-bottom:28px}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:16px}
label{font-size:11px;font-weight:500;color:#888;text-transform:uppercase;letter-spacing:.04em}
input{padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;font-family:inherit;outline:none;width:100%}
input:focus{border-color:#999;box-shadow:0 0 0 3px rgba(0,0,0,.05)}
input::placeholder{color:#bbb}
.btn{width:100%;padding:11px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;margin-top:4px;transition:opacity .15s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{border-radius:8px;padding:10px 14px;font-size:13px;margin-top:14px;display:none}
.msg.err{background:#fcebeb;color:#a32d2d}
.msg.ok{background:#eaf3de;color:#3b6d11}
</style>
</head>
<body>
<div class="card">
  <h1>Business Tracker</h1>
  <p class="sub">GIIS Dubai · Student Business Initiative</p>
  <div class="fg"><label>Username</label><input type="text" id="username" placeholder="e.g. stall1" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
  <div class="fg"><label>Password</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn" id="loginBtn">Sign in</button>
  <div class="msg" id="msg"></div>
</div>
<script>
(function() {
  var loginBtn = document.getElementById('loginBtn');
  var msgEl = document.getElementById('msg');
  var SESSION_KEY = 'bt_session';

  function getSession() { try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (e) { return null; } }
  function setSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  // If already logged in with a still-valid session, skip straight to the right page.
  (async function() {
    var s = getSession();
    if (!s) return;
    var res = await sb.rpc('validate_session', { p_id: s.id, p_token: s.token });
    if (res.data && res.data.length) doRedirect(res.data[0], s.token);
    else clearSession();
  })();

  loginBtn.addEventListener('click', async function() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    if (!username || !password) { showMsg('Please enter your username and password.', 'err'); return; }
    loginBtn.disabled = true; loginBtn.textContent = 'Signing in...'; msgEl.style.display = 'none';

    var res = await sb.rpc('login_user', { p_username: username, p_password: password });
    if (res.error || !res.data || !res.data.length) {
      showMsg('Invalid username or password.', 'err');
      loginBtn.disabled = false; loginBtn.textContent = 'Sign in'; return;
    }
    var u = res.data[0];
    doRedirect(u, u.session_token);
  });

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') loginBtn.click();
  });

  function doRedirect(u, token) {
    setSession({ id: u.id, username: u.username, name: u.name, role: u.role, event_type: u.event_type, stall_name: u.stall_name, token: token });
    if (u.role === 'admin') window.location.href = 'admin.html';
    else if (u.event_type === 'foodfest') window.location.href = 'foodfest.html';
    else window.location.href = 'stall.html';
  }

  function showMsg(msg, type) { msgEl.textContent = msg; msgEl.className = 'msg ' + type; msgEl.style.display = 'block'; }
})();
</script>
</body>
</html>
